[package]
name = "klayout-sys"
description = "KLayout's layout database compiled for WebAssembly, with a minimal C ABI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
links = "klayout"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }

[dev-dependencies]
png = "0.18"
